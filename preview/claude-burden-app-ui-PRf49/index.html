<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="BURDEN by PVA — carry a burden before the Lord" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Burden" />
    <title>Burden — PVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --bg: #f4f6fb;
        --bg-pure: #ffffff;
        --fg: #0b1638;
        --fg-soft: #1f2c52;
        --muted: rgba(11,22,56,0.5);
        --muted-strong: rgba(11,22,56,0.72);
        --line: rgba(11,22,56,0.08);
        --line-strong: rgba(11,22,56,0.14);
        --glass-bg: rgba(95,150,250,0.5);
        --glass-border: rgba(255,255,255,0.45);
        --glass-highlight: rgba(255,255,255,0.55);
        --navy-deep: #0b1638;
        --navy-mid: #1a2c66;
        --navy-bright: #3d5db5;
        --accent: #2b4aa3;
        --accent-soft: rgba(43,74,163,0.10);
        --accent-border: rgba(43,74,163,0.28);
        --font-helvetica: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        /* Everything after the intro is JetBrains Mono. */
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      body { overflow: hidden; }
      #app {
        position: fixed;
        inset: 0;
        height: 100dvh;
        background: var(--bg);
        overflow: hidden;
      }
      /* Soft blue glow blobs behind everything so glass cards have something to refract. */
      #app::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 45% at 18% 18%, rgba(80,135,235,0.22), transparent 65%),
          radial-gradient(ellipse 50% 50% at 85% 82%, rgba(40,90,200,0.18), transparent 70%),
          radial-gradient(ellipse 40% 40% at 50% 50%, rgba(120,165,255,0.12), transparent 75%);
        pointer-events: none;
        z-index: 0;
      }
      .screen { z-index: 1; }

      /* ---------- screen system ---------- */
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease;
      }
      .screen.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* ---------- screen 1: intro (Helvetica, fills screen) ---------- */
      #screen-intro {
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        text-align: center;
        font-family: var(--font-helvetica);
      }
      #intro-text {
        font-family: var(--font-helvetica);
        font-weight: 300;
        letter-spacing: -0.015em;
        line-height: 1.12;
        color: var(--fg);
        font-size: clamp(1.9rem, 8vw, 3.6rem);
        max-width: 16ch;
        opacity: 0;
        filter: blur(22px);
        transform: translateY(10px);
        transition: opacity 2600ms cubic-bezier(0.22, 1, 0.36, 1),
                    filter 2600ms cubic-bezier(0.22, 1, 0.36, 1),
                    transform 2600ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #intro-text.in {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
      #intro-hint {
        position: absolute;
        bottom: max(2rem, env(safe-area-inset-bottom));
        font-family: var(--font-helvetica);
        font-size: 0.74rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
        transition: opacity 700ms ease 2800ms;
      }
      #intro-text.in ~ #intro-hint { opacity: 1; }

      /* ---------- screen 2: 3-title menu ---------- */
      #screen-menu {
        padding: max(1.5rem, env(safe-area-inset-top)) 1.75rem max(2rem, env(safe-area-inset-bottom));
        justify-content: center;
        align-items: flex-start;
      }
      .brand {
        position: absolute;
        top: max(1.4rem, env(safe-area-inset-top));
        left: 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.05rem;
      }
      .brand-name {
        font-family: var(--font-mono);
        font-size: clamp(1.7rem, 6.4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1;
        color: var(--fg);
        text-transform: uppercase;
      }
      .brand-tag {
        margin-top: 0.15rem;
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-top: 2rem;
      }
      .menu-item {
        position: relative;
        background: transparent;
        border: none;
        color: var(--fg);
        text-align: left;
        padding: 0.45rem 0.4rem;
        font-family: var(--font-helvetica);
        font-size: clamp(1.4rem, 6vw, 2.1rem);
        font-weight: 400;
        letter-spacing: -0.005em;
        line-height: 1.05;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 220ms ease, opacity 220ms ease, color 220ms ease;
      }
      .menu-item:hover { color: var(--accent); }
      .menu-item:active { transform: scale(0.985); opacity: 0.85; }

      /* ---------- shared sub header ---------- */
      .sub-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: max(1.2rem, env(safe-area-inset-top)) 1rem 0.8rem;
        z-index: 5;
        flex-shrink: 0;
      }
      .back-btn {
        background: transparent;
        border: none;
        color: var(--fg);
        padding: 0.6rem 0.8rem;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .sub-title {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted-strong);
      }
      .sub-spacer { width: 4.5rem; }
      /* Deck screen now matches global light palette; no overrides needed. */

      /* ---------- screen 3: burden list ---------- */
      #screen-list {
        overflow: hidden;
      }
      .list-scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.25rem 1.25rem max(2rem, env(safe-area-inset-bottom));
      }
      .list-head {
        padding: 0.5rem 0.3rem 0.4rem;
      }
      .list-eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .list-title {
        margin-top: 0.5rem;
        font-family: var(--font-mono);
        font-size: clamp(1.6rem, 6.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1;
        text-transform: uppercase;
        color: var(--fg);
      }
      .list-subtitle {
        margin-top: 0.7rem;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 400;
        line-height: 1.45;
        color: var(--muted-strong);
        max-width: 34ch;
        text-transform: none;
        letter-spacing: 0;
      }
      .burden-list {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        margin-top: 1.5rem;
        padding-bottom: 1rem;
      }
      /* Every primary card in the app: blue glass with white text. */
      .burden-card {
        position: relative;
        text-align: left;
        background:
          linear-gradient(180deg, rgba(95,150,250,0.58) 0%, rgba(30,75,195,0.48) 100%);
        border: 1px solid rgba(255,255,255,0.45);
        border-radius: 22px;
        padding: 1.05rem 1.1rem 1rem;
        color: #ffffff;
        font-family: var(--font-mono);
        cursor: pointer;
        backdrop-filter: blur(22px) saturate(170%);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.55) inset,
          0 22px 44px -22px rgba(20,40,90,0.45),
          0 2px 8px rgba(20,40,90,0.08);
        transition: transform 220ms ease, box-shadow 220ms ease;
      }
      .burden-card:active {
        transform: translateY(1px) scale(0.99);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.55) inset,
          0 12px 26px -20px rgba(20,40,90,0.45);
      }
      .burden-card-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }
      .burden-card-church {
        font-size: 0.6rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.72);
      }
      .burden-card-tag {
        font-size: 0.58rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.92);
      }
      .burden-card-name {
        margin-top: 0.45rem;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.003em;
        line-height: 1.25;
        color: #ffffff;
      }
      .burden-card-objective {
        margin-top: 0.45rem;
        font-size: 0.82rem;
        line-height: 1.45;
        color: rgba(255,255,255,0.88);
        font-weight: 400;
      }
      .burden-card-progress { margin-top: 0.95rem; }
      .progress-bar {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.22);
        overflow: hidden;
      }
      .progress-bar > span {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        background: linear-gradient(90deg, #ffffff, #d8e7ff);
        border-radius: inherit;
        box-shadow: 0 0 10px rgba(255,255,255,0.6);
      }
      .burden-card-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 0.55rem;
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
      }

      /* Featured (Burden of the Week) variant — slightly brighter blue. */
      .burden-card.featured {
        background:
          linear-gradient(180deg, rgba(125,170,255,0.62) 0%, rgba(40,90,210,0.5) 100%);
        border: 1px solid rgba(255,255,255,0.6);
      }
      .featured-flag {
        display: inline-block;
        font-size: 0.58rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }
      /* Fully funded burdens — softer, marked done. */
      .burden-card.funded {
        background:
          linear-gradient(180deg, rgba(160,200,255,0.45) 0%, rgba(80,130,220,0.38) 100%);
      }
      .funded-flag {
        display: inline-block;
        font-size: 0.58rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 0.5rem;
        padding: 0.18rem 0.45rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.22);
        border: 1px solid rgba(255,255,255,0.4);
      }

      /* ---------- spree extras ---------- */
      .spree-counter {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 1.1rem 0.2rem 0;
        padding: 0.85rem 1rem;
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(95,150,250,0.55) 0%, rgba(30,75,195,0.45) 100%);
        border: 1px solid rgba(255,255,255,0.45);
        color: #ffffff;
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.5) inset,
          0 12px 24px -18px rgba(20,40,90,0.4);
      }
      .spree-counter-label {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.85);
      }
      .spree-counter-value {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        letter-spacing: 0.04em;
        color: #ffffff;
        font-weight: 600;
      }
      .spree-action {
        margin-top: 0.85rem;
        display: flex;
        justify-content: flex-end;
        border-top: 1px solid rgba(255,255,255,0.22);
        padding-top: 0.7rem;
      }
      .spree-action-pill {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 0.55rem 0.95rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.55);
        background: rgba(255,255,255,0.18);
        color: #ffffff;
        cursor: pointer;
        transition: transform 180ms ease, opacity 180ms ease;
      }
      .spree-action-pill:active { transform: scale(0.97); opacity: 0.9; }
      .spree-action-pill.given {
        background: #ffffff;
        color: var(--navy-mid);
        border-color: transparent;
      }
      .spree-action-pill[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .spree-section-label {
        margin: 1.4rem 0.2rem 0.55rem;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ---------- spree top deck (horizontal carousel inside the list scroll) ---------- */
      .spree-deck {
        position: relative;
        width: calc(100% + 2.5rem);
        margin: 0.85rem -1.25rem 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding: 0.4rem 1.25rem 0.9rem;
        gap: 0.85rem;
      }
      .spree-deck::-webkit-scrollbar { display: none; }
      .spree-tile {
        position: relative;
        flex: 0 0 78vw;
        max-width: 320px;
        min-height: 13.5rem;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        border-radius: 22px;
        padding: 1.05rem 1.1rem 0.95rem;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(180deg, rgba(95,150,250,0.58) 0%, rgba(30,75,195,0.48) 100%);
        border: 1px solid rgba(255,255,255,0.45);
        color: #ffffff;
        backdrop-filter: blur(22px) saturate(170%);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.5) inset,
          0 22px 44px -22px rgba(20,40,90,0.45),
          0 2px 8px rgba(20,40,90,0.08);
        cursor: pointer;
      }
      .spree-tile.funded {
        background:
          linear-gradient(180deg, rgba(160,200,255,0.45) 0%, rgba(80,130,220,0.38) 100%);
      }
      .spree-tile-name {
        margin-top: 0.45rem;
        font-family: var(--font-mono);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.25;
      }
      .spree-tile-objective {
        margin-top: 0.4rem;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        line-height: 1.45;
        color: rgba(255,255,255,0.88);
        flex: 1;
      }
      .spree-tile-foot {
        margin-top: 0.6rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6rem;
      }
      .spree-tile-meta {
        font-family: var(--font-mono);
        font-size: 0.56rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.72);
      }

      /* ---------- screen 3b: burdens swipe carousel ---------- */
      /* Uses the global light palette + glow blobs; no overrides needed. */

      .deck-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      /* Soft blue glow blobs so the glass tiles have something to refract. */
      .deck-area::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 40% at 18% 22%, rgba(80,135,235,0.28), transparent 65%),
          radial-gradient(ellipse 45% 50% at 82% 78%, rgba(40,90,200,0.22), transparent 70%),
          radial-gradient(ellipse 35% 30% at 50% 100%, rgba(120,165,255,0.18), transparent 75%);
        pointer-events: none;
      }

      .deck {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-inline: 7vw;
        gap: 1rem;
      }
      .deck::-webkit-scrollbar { display: none; }

      .tile {
        position: relative;
        flex: 0 0 86vw;
        max-width: 360px;
        height: min(62vh, 540px);
        scroll-snap-align: center;
        scroll-snap-stop: always;
        border-radius: 26px;
        padding: 1.4rem 1.3rem 1.2rem;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(180deg, rgba(95,150,250,0.55) 0%, rgba(30,75,195,0.45) 100%);
        border: 1px solid rgba(255,255,255,0.45);
        backdrop-filter: blur(24px) saturate(170%);
        -webkit-backdrop-filter: blur(24px) saturate(170%);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.5) inset,
          0 24px 50px -22px rgba(20,40,90,0.45),
          0 2px 8px rgba(20,40,90,0.08);
        color: #ffffff;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      .tile:active { transform: scale(0.99); }

      .tile-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }
      .tile-church {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.72);
      }
      .tile-tag {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.92);
      }
      .tile-name {
        margin-top: 0.6rem;
        font-family: var(--font-mono);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.005em;
        line-height: 1.2;
        color: #ffffff;
      }
      .tile-body {
        margin-top: 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        line-height: 1.5;
        color: rgba(255,255,255,0.92);
        flex: 1;
        overflow: hidden;
      }
      .tile-progress { margin-top: 0.9rem; }
      .tile .progress-bar { background: rgba(255,255,255,0.22); }
      .tile .progress-bar > span {
        background: linear-gradient(90deg, #ffffff, #d8e7ff);
        box-shadow: 0 0 10px rgba(255,255,255,0.55);
      }
      .tile-meta {
        margin-top: 0.55rem;
        display: flex;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 0.58rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
      }

      .deck-hint {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(11,22,56,0.45);
        padding: 0.9rem 0 max(1.25rem, env(safe-area-inset-bottom));
      }
      .deck-empty {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(11,22,56,0.45);
        line-height: 1.8;
      }

      /* ---------- screen 4: burden detail ---------- */
      #screen-detail { background: var(--bg); }
      .detail-scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.25rem 1.25rem max(2rem, env(safe-area-inset-bottom));
      }
      .detail-head {
        padding: 0.5rem 0.2rem 1.2rem;
        border-bottom: 1px solid var(--line);
      }
      .detail-church {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .detail-name {
        margin-top: 0.55rem;
        font-family: var(--font-mono);
        font-size: clamp(1.25rem, 4.6vw, 1.65rem);
        font-weight: 700;
        letter-spacing: -0.012em;
        line-height: 1.2;
        color: var(--fg);
      }
      .detail-objective {
        margin-top: 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        font-weight: 400;

    <script>
      // ---------- haptics ----------
      const canVibrate = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
      function vibrate(pattern) {
        if (!canVibrate) return;
        try { navigator.vibrate(pattern); } catch (_) {}
      }
      // Rewind-style intensifying open: pulses get longer, gaps shrink, big finale.
      function runIntroHaptics() {
        if (!canVibrate) return;
        const pattern = [
          18, 360,
          24, 310,
          32, 260,
          44, 215,
          60, 175,
          82, 140,
          110, 110,
          150, 85,
          200, 60,
          280
        ];
        vibrate(pattern);
      }

      // ---------- screen routing ----------
      const screens = {
        intro:   document.getElementById("screen-intro"),
        menu:    document.getElementById("screen-menu"),
        list:    document.getElementById("screen-list"),
        deck:    document.getElementById("screen-deck"),
        detail:  document.getElementById("screen-detail"),
      };
      // Tracks which list-style screen ("list" or "deck") opened the detail,
      // so the detail Back button returns to the right place.
      let lastListScreen = "list";
      function show(name) {
        Object.entries(screens).forEach(([key, el]) => {
          el.classList.toggle("active", key === name);
        });
        if (name === "list") screens.list.querySelector(".list-scroll").scrollTop = 0;
        if (name === "detail") document.getElementById("detail-scroll").scrollTop = 0;
      }
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.addEventListener("click", () => {
          vibrate(12);
          show(el.dataset.go);
        });
      });
      document.getElementById("detail-back-btn").addEventListener("click", () => {
        vibrate(12);
        show(lastListScreen);
      });

      // ---------- intro fade-in ----------
      const introText = document.getElementById("intro-text");
      const introScreen = document.getElementById("screen-intro");
      requestAnimationFrame(() => {
        setTimeout(() => {
          introText.classList.add("in");
          runIntroHaptics();
        }, 250);
      });
      introScreen.addEventListener("click", () => {
        if (!introText.classList.contains("in")) return;
        vibrate(22);
        show("menu");
      });

      // ---------- burdens (church-funded projects) ----------
      const BURDENS = [

        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? new Set(JSON.parse(raw)) : new Set();
        } catch (_) { return new Set(); }

        listSubTitle.textContent = cfg.title;
        renderListExtras(key);
        renderBurdenList(BURDENS.filter(cfg.filter));
        show("list");
      }

      function renderListExtras(key) {
        // Clear any extras from a previous render.
        document
          .querySelectorAll(".spree-counter, .spree-deck, .spree-section-label")
          .forEach((el) => el.remove());
        if (key !== "spree") return;

        const givenInSpree = [...spreeGiven].filter((id) => SPREE_IDS.has(id)).length;
        const counter = document.createElement("div");
        counter.className = "spree-counter";
        counter.innerHTML = `
          <span class="spree-counter-label">Your Spree</span>
          <span class="spree-counter-value">$${givenInSpree} of $${SPREE_TOTAL} given</span>
        `;
        burdenListEl.parentNode.insertBefore(counter, burdenListEl);

        const deck = buildSpreeDeck();
        burdenListEl.parentNode.insertBefore(deck, burdenListEl);

        const label = document.createElement("div");
        label.className = "spree-section-label";
        label.textContent = "Wider list of burdens";
        burdenListEl.parentNode.insertBefore(label, burdenListEl);
      }

      function buildSpreeDeck() {
        const deck = document.createElement("div");
        deck.className = "spree-deck";
        BURDENS.filter((b) => SPREE_IDS.has(b.id)).forEach((b) => {
          const reached = b.state.raised >= b.state.goal;
          const isGiven = spreeGiven.has(b.id);
          const tile = document.createElement("div");
          tile.className = "spree-tile" + (reached ? " funded" : "");
          tile.setAttribute("role", "button");
          tile.setAttribute("tabindex", "0");
          tile.innerHTML = `
            <span class="burden-card-church">${b.church}</span>
            <h3 class="spree-tile-name">${b.name}</h3>
            <p class="spree-tile-objective">${b.objective}</p>
            <div class="spree-tile-foot">
              <span class="spree-tile-meta">${fmtMoney(b.state.raised, b.state.currency)} of ${fmtMoney(b.state.goal, b.state.currency)}</span>
              ${reached
                ? `<button type="button" class="spree-action-pill" disabled>✓ Goal reached</button>`
                : `<button type="button" class="spree-action-pill ${isGiven ? "given" : ""}">${isGiven ? "✓ $1" : "+ $1"}</button>`}
            </div>
          `;
          tile.addEventListener("click", () => {
            vibrate(14);
            openBurden(b.id);
          });
          if (!reached) {
            const pill = tile.querySelector(".spree-action-pill");
            pill.addEventListener("click", (e) => {
              e.stopPropagation();
              if (spreeGiven.has(b.id)) {
                spreeGiven.delete(b.id);
                vibrate(10);
              } else {
                spreeGiven.add(b.id);
                vibrate([18, 50, 22]);
              }
              saveSpreeGiven(spreeGiven);
              openList("spree");
            });
          }
          deck.appendChild(tile);
        });
        return deck;
      }

      function renderBurdenList(items) {
        burdenListEl.innerHTML = "";
        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "list-subtitle";
          empty.textContent = "No burdens here right now. Check back soon.";
          burdenListEl.appendChild(empty);
          return;
        }
        items.forEach((b) => {
          const p = pct(b.state.raised, b.state.goal);
          const reached = b.state.raised >= b.state.goal;
          const card = document.createElement("div");
          let classes = "burden-card";
          if (b.featured && currentListKey === "weekly") classes += " featured";
          if (reached) classes += " funded";
          card.className = classes;
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");
          card.innerHTML = `
            ${reached ? `<span class="funded-flag">Goal reached</span>` :
              (b.featured && currentListKey === "weekly" ? `<span class="featured-flag">This Week</span>` : "")}
            <div class="burden-card-row">
              <span class="burden-card-church">${b.church}</span>
              <span class="burden-card-tag">${b.tag}</span>
            </div>
            <h2 class="burden-card-name">${b.name}</h2>
            <p class="burden-card-objective">${b.objective}</p>
            <div class="burden-card-progress">
              <div class="progress-bar"><span style="width:${p}%"></span></div>
              <div class="burden-card-meta">
                <span>${fmtMoney(b.state.raised, b.state.currency)} of ${fmtMoney(b.state.goal, b.state.currency)}</span>
                <span>${b.prayer.members} praying</span>
              </div>
            </div>
          `;
          card.addEventListener("click", () => {
            vibrate(14);
            openBurden(b.id);
          });
          burdenListEl.appendChild(card);
        });
      }

      // Wire the 3 menu items: "Burdens" → swipe deck, others → list screen.
      document.querySelectorAll("[data-list]").forEach((el) => {
        el.addEventListener("click", () => {
          vibrate(14);
          const key = el.dataset.list;
          if (key === "burden") openDeck();
          else openList(key);
        });
      });

      // ---------- burden swipe deck (Hinge-style) ----------
      const deckEl = document.getElementById("deck");

      function openDeck() {
        lastListScreen = "deck";
        buildDeck();
        show("deck");
        // Reset scroll to the first card when re-entering.
        requestAnimationFrame(() => { deckEl.scrollLeft = 0; });
      }

      function buildDeck() {
        deckEl.innerHTML = "";
        if (BURDENS.length === 0) {
          deckEl.innerHTML = '<div class="deck-empty">No burdens right now.<br/>Check back soon.</div>';
          return;
        }
        BURDENS.forEach((b) => {
          const p = pct(b.state.raised, b.state.goal);
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.dataset.id = b.id;
          tile.innerHTML = `
            <div class="tile-row">
              <span class="tile-church">${b.church}</span>
              <span class="tile-tag">${b.tag}</span>
            </div>
            <h2 class="tile-name">${b.name}</h2>
            <div class="tile-body">${b.objective}</div>
            <div class="tile-progress">
              <div class="progress-bar"><span style="width:${p}%"></span></div>
              <div class="tile-meta">
                <span>${fmtMoney(b.state.raised, b.state.currency)} of ${fmtMoney(b.state.goal, b.state.currency)}</span>
                <span>${b.prayer.members} praying</span>
              </div>
            </div>
          `;
          tile.addEventListener("click", () => {
            vibrate(14);
            openBurden(b.id);
          });
          deckEl.appendChild(tile);
        });
      }

      // ---------- burden detail ----------
      const detailScroll = document.getElementById("detail-scroll");
      function openBurden(id) {
        const b = BURDENS.find((x) => x.id === id);
        if (!b) return;
        const p = pct(b.state.raised, b.state.goal);
        const isJoined = joined.has(b.id);
        const reached = b.state.raised >= b.state.goal;
        detailScroll.innerHTML = `
          <div class="detail-head">
            <span class="detail-church">${b.church} · ${b.tag}</span>
            <h2 class="detail-name">${b.name}</h2>
            <p class="detail-objective">${b.objective}</p>
            <div class="detail-progress">
              <div class="detail-progress-numbers">
                <span><strong>${fmtMoney(b.state.raised, b.state.currency)}</strong> of ${fmtMoney(b.state.goal, b.state.currency)}</span>
                <span>${reached ? "Goal reached" : p + "%"}</span>
              </div>
              <div class="progress-bar"><span style="width:${p}%"></span></div>
            </div>
          </div>

          <div class="detail-section">
            <h3>Current State</h3>
            <p>${b.state.note}</p>
          </div>

          <div class="detail-section">
            <h3>Who Handles What</h3>
            <ul class="role-list">
              ${b.handlers.map(h => `
                <li><span class="role">${h.role}</span><span>${h.person}</span></li>
              `).join("")}
            </ul>
          </div>

          <div class="detail-section">
            <h3>Money Workflow</h3>
            <ol class="workflow-steps">
              ${b.workflow.map(step => `<li>${step}</li>`).join("")}
            </ol>
          </div>

          <div class="detail-section">
            <h3>On the Ground</h3>
            <p>${b.delivery}</p>
          </div>

          <div class="prayer-section">
            <h3>Prayer Group</h3>
            <div class="prayer-meta">${b.prayer.members + (isJoined ? 1 : 0)} praying · ${b.prayer.meets}</div>
            <p>Donors who carry this burden also pray for it. Prayer here is specific to this burden — nothing generic.</p>
            <p class="prayer-focus">“${b.prayer.focus}”</p>
          </div>

          <div class="detail-actions">
            <button class="btn ${isJoined ? "joined" : "btn-ghost"}" id="join-btn">
              ${isJoined ? "✓ In the prayer group" : "Join the prayer group"}
            </button>
            ${reached
              ? `<button class="btn btn-reached" disabled>✓ Goal reached</button>`
              : `<button class="btn btn-primary" id="contribute-btn">Contribute</button>`}
          </div>
        `;

        document.getElementById("join-btn").addEventListener("click", () => {
          if (joined.has(b.id)) {
            joined.delete(b.id);
            vibrate(10);
          } else {
            joined.add(b.id);
            vibrate([18, 60, 24]);
          }
          saveJoined(joined);
          openBurden(b.id);
        });

        if (!reached) {
          const contributeBtn = document.getElementById("contribute-btn");
          contributeBtn.addEventListener("click", () => {
            vibrate([14, 40, 14]);
            contributeBtn.textContent = "Thank you · receipt coming";
            contributeBtn.disabled = true;
            contributeBtn.style.opacity = "0.85";
          });
        }

        show("detail");
      }
    </script>
  </body>
</html>
