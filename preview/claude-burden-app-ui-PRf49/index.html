<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="BURDEN by PVA — carry a burden before the Lord" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Burden" />
    <title>Burden — PVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --bg: #04060f;
        --fg: #f4f6ff;
        --muted: rgba(220,228,255,0.5);
        --muted-strong: rgba(220,228,255,0.78);
        --glass-bg: rgba(140,170,235,0.05);
        --glass-border: rgba(140,170,235,0.16);
        --glass-highlight: rgba(180,200,245,0.18);
        --navy-deep: #0b1638;
        --navy-mid: #1a2c66;
        --navy-bright: #3d5db5;
        --accent: #7da3ff;
        --accent-soft: rgba(125,163,255,0.18);
        --accent-border: rgba(125,163,255,0.32);
        --font-helvetica: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        /* Everything after the intro is JetBrains Mono. */
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      body { overflow: hidden; }
      #app {
        position: fixed;
        inset: 0;
        height: 100dvh;
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, #0e1a44 0%, #060a1f 45%, #02030a 100%);
        overflow: hidden;
      }

      /* ---------- screen system ---------- */
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease;
      }
      .screen.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* ---------- screen 1: intro (Helvetica, fills screen) ---------- */
      #screen-intro {
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        text-align: center;
        font-family: var(--font-helvetica);
      }
      #intro-text {
        font-family: var(--font-helvetica);
        font-weight: 300;
        letter-spacing: -0.015em;
        line-height: 1.12;
        color: #f4f6ff;
        font-size: clamp(1.9rem, 8vw, 3.6rem);
        max-width: 16ch;
        opacity: 0;
        filter: blur(22px);
        transform: translateY(10px);
        transition: opacity 2600ms cubic-bezier(0.22, 1, 0.36, 1),
                    filter 2600ms cubic-bezier(0.22, 1, 0.36, 1),
                    transform 2600ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #intro-text.in {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
      #intro-hint {
        position: absolute;
        bottom: max(2rem, env(safe-area-inset-bottom));
        font-family: var(--font-helvetica);
        font-size: 0.74rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
        transition: opacity 700ms ease 2800ms;
      }
      #intro-text.in ~ #intro-hint { opacity: 1; }

      /* ---------- screen 2: 3-title menu ---------- */
      #screen-menu {
        padding: max(3rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));
        justify-content: space-between;
      }
      .menu-eyebrow {
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .menu-greet {
        margin-top: 0.4rem;
        font-size: 1.15rem;
        font-weight: 400;
        letter-spacing: -0.005em;
        color: var(--fg);
      }
      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-top: 2rem;
      }
      .menu-item {
        position: relative;
        background: transparent;
        border: none;
        color: var(--fg);
        text-align: left;
        padding: 0.45rem 0.4rem;
        font-family: var(--font-mono);
        font-size: clamp(1.3rem, 5.6vw, 1.9rem);
        font-weight: 600;
        letter-spacing: -0.005em;
        line-height: 1.05;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 220ms ease, opacity 220ms ease, color 220ms ease;
      }
      .menu-item:hover { color: var(--accent); }
      .menu-item:active { transform: scale(0.985); opacity: 0.85; }

      /* ---------- shared sub header ---------- */
      .sub-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: max(1.2rem, env(safe-area-inset-top)) 1rem 0.8rem;
        z-index: 5;
        flex-shrink: 0;
      }
      .back-btn {
        background: transparent;
        border: none;
        color: var(--fg);
        padding: 0.6rem 0.8rem;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .sub-title {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sub-spacer { width: 4.5rem; }

      /* ---------- screen 3: burden list ---------- */
      #screen-list {
        overflow: hidden;
      }
      .list-scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.25rem 1.25rem max(2rem, env(safe-area-inset-bottom));
      }
      .list-head {
        padding: 0.5rem 0.3rem 0.4rem;
      }
      .list-eyebrow {
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .list-title {
        margin-top: 0.5rem;
        font-family: var(--font-mono);
        font-size: clamp(1.6rem, 6.4vw, 2.3rem);
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1;
        text-transform: uppercase;
      }
      .list-subtitle {
        margin-top: 0.7rem;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 400;
        line-height: 1.45;
        color: var(--muted-strong);
        max-width: 34ch;
        text-transform: none;
        letter-spacing: 0;
      }
      .burden-list {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        margin-top: 1.5rem;
        padding-bottom: 1rem;
      }
      .burden-card {
        position: relative;
        text-align: left;
        background:
          linear-gradient(180deg, rgba(26,44,102,0.42) 0%, rgba(11,22,56,0.28) 100%);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 1.05rem 1.1rem 1rem;
        color: var(--fg);
        font-family: var(--font-mono);
        cursor: pointer;
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        box-shadow:
          0 1px 0 var(--glass-highlight) inset,
          0 18px 36px -22px rgba(0,0,0,0.85);
        transition: transform 220ms ease, opacity 220ms ease;
      }
      .burden-card:active { transform: scale(0.985); opacity: 0.9; }
      .burden-card-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }
      .burden-card-church {
        font-size: 0.6rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .burden-card-tag {
        font-size: 0.58rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .burden-card-name {
        margin-top: 0.45rem;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.003em;
        line-height: 1.25;
      }
      .burden-card-objective {
        margin-top: 0.45rem;
        font-size: 0.8rem;
        line-height: 1.45;
        color: var(--muted-strong);
        font-weight: 400;
      }
      .burden-card-progress { margin-top: 0.95rem; }
      .progress-bar {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
      }
      .progress-bar > span {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        background: linear-gradient(90deg, #3d5db5, #7da3ff);
        border-radius: inherit;
        box-shadow: 0 0 12px rgba(125,163,255,0.45);
      }
      .burden-card-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 0.55rem;
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Featured (Burden of the Week) variant */
      .burden-card.featured {
        background:
          linear-gradient(180deg, rgba(61,93,181,0.32) 0%, rgba(26,44,102,0.18) 100%);
        border: 1px solid var(--accent-border);
        box-shadow:
          0 1px 0 var(--glass-highlight) inset,
          0 18px 36px -22px rgba(0,0,0,0.85),
          0 0 0 1px rgba(125,163,255,0.06);
      }
      .featured-flag {
        display: inline-block;
        font-size: 0.58rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.5rem;
      }

      /* ---------- screen 4: burden detail ---------- */
      #screen-detail { background: var(--bg); }
      .detail-scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.25rem 1.25rem max(2rem, env(safe-area-inset-bottom));
      }
      .detail-head {
        padding: 0.5rem 0.2rem 1.2rem;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .detail-church {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .detail-name {
        margin-top: 0.55rem;
        font-family: var(--font-mono);
        font-size: clamp(1.25rem, 4.6vw, 1.65rem);
        font-weight: 700;
        letter-spacing: -0.012em;
        line-height: 1.2;
      }
      .detail-objective {
        margin-top: 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        font-weight: 400;
        line-height: 1.5;
        color: var(--muted-strong);
      }
      .detail-progress { margin-top: 1.15rem; }
      .detail-progress-numbers {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .detail-progress-numbers strong {
        color: var(--fg);
        font-weight: 600;
      }
      .detail-progress .progress-bar {
        margin-top: 0.5rem;
        height: 5px;
      }
      .detail-section {
        padding: 1.25rem 0.2rem 0.1rem;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .detail-section:last-of-type { border-bottom: none; }
      .detail-section h3 {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.7rem;
      }
      .detail-section p,
      .detail-section li {
        font-family: var(--font-mono);
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.5;
        color: rgba(255,255,255,0.92);
      }
      .detail-section .role-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .detail-section .role-list li {
        display: flex;
        gap: 0.6rem;
        align-items: baseline;
      }
      .detail-section .role-list li .role {
        flex-shrink: 0;
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        min-width: 7.5rem;
      }
      .workflow-steps {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding-left: 0;
        list-style: none;
        counter-reset: step;
      }
      .workflow-steps li {
        position: relative;
        padding-left: 2rem;
        counter-increment: step;
      }
      .workflow-steps li::before {
        content: counter(step);
        position: absolute;
        left: 0;
        top: 0.05rem;
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        color: var(--muted-strong);
      }

      .prayer-section {
        margin-top: 1.25rem;
        padding: 1.1rem 1.15rem;
        background:
          linear-gradient(180deg, rgba(61,93,181,0.22) 0%, rgba(26,44,102,0.06) 100%);
        border: 1px solid var(--accent-border);
        border-radius: 20px;
      }
      .prayer-section h3 {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.45rem;
      }
      .prayer-section .prayer-meta {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.6rem;
      }
      .prayer-section p {
        font-family: var(--font-mono);
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.5;
        color: rgba(255,255,255,0.92);
      }
      .prayer-section .prayer-focus {
        margin-top: 0.55rem;
        font-style: italic;
        color: var(--muted-strong);
      }

      .detail-actions {
        position: sticky;
        bottom: 0;
        margin-top: 1.5rem;
        padding: 0.8rem 0 0.2rem;
        display: flex;
        gap: 0.6rem;
        background: linear-gradient(180deg, rgba(4,6,15,0), #04060f 35%);
      }
      .btn {
        flex: 1;
        border: none;
        padding: 0.95rem 1rem;
        border-radius: 14px;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 180ms ease, opacity 180ms ease;
      }
      .btn:active { transform: scale(0.98); opacity: 0.9; }
      .btn-ghost {
        background: rgba(125,163,255,0.06);
        border: 1px solid var(--glass-border);
        color: var(--fg);
      }
      .btn-primary {
        background: linear-gradient(180deg, #3d5db5, #15235a);
        color: #f4f6ff;
        box-shadow: 0 8px 24px -10px rgba(61,93,181,0.55);
      }
      .btn.joined {
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid var(--accent-border);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Screen 1: intro -->
      <section id="screen-intro" class="screen active">
        <h1 id="intro-text">Thank you for supporting a burden today</h1>
        <span id="intro-hint">Tap to continue</span>
      </section>

      <!-- Screen 2: 3-title menu -->
      <section id="screen-menu" class="screen">
        <div>
          <div>
            <span class="menu-eyebrow">BURDEN by PVA</span>
            <div class="menu-greet">Welcome back</div>
          </div>
          <div class="menu-list">
            <button class="menu-item" data-list="weekly">Burden of the Week</button>
            <button class="menu-item" data-list="burden">Burden</button>
            <button class="menu-item" data-list="spree">Spree</button>
          </div>
        </div>
      </section>

      <!-- Screen 3: burden list (shared by all 3 menu items) -->
      <section id="screen-list" class="screen">
        <div class="sub-header">
          <button class="back-btn" data-go="menu">&larr; Back</button>
          <span class="sub-title" id="list-sub-title">Burden</span>
          <span class="sub-spacer"></span>
        </div>
        <div class="list-scroll">
          <div class="list-head">
            <span class="list-eyebrow" id="list-eyebrow">Burden of the Week</span>
            <h1 class="list-title" id="list-title">Burden</h1>
            <p class="list-subtitle" id="list-subtitle">Pick the burden you want to carry before the Lord.</p>
          </div>
          <div class="burden-list" id="burden-list"></div>
        </div>
      </section>

      <!-- Screen 4: burden detail -->
      <section id="screen-detail" class="screen">
        <div class="sub-header">
          <button class="back-btn" data-go="list">&larr; Back</button>
          <span class="sub-title">Burden</span>
          <span class="sub-spacer"></span>
        </div>
        <div class="detail-scroll" id="detail-scroll"></div>
      </section>
    </div>

    <script>
      // ---------- haptics ----------
      const canVibrate = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
      function vibrate(pattern) {
        if (!canVibrate) return;
        try { navigator.vibrate(pattern); } catch (_) {}
      }
      // Rewind-style intensifying open: pulses get longer, gaps shrink, big finale.
      function runIntroHaptics() {
        if (!canVibrate) return;
        const pattern = [
          18, 360,
          24, 310,
          32, 260,
          44, 215,
          60, 175,
          82, 140,
          110, 110,
          150, 85,
          200, 60,
          280
        ];
        vibrate(pattern);
      }

      // ---------- screen routing ----------
      const screens = {
        intro:   document.getElementById("screen-intro"),
        menu:    document.getElementById("screen-menu"),
        list:    document.getElementById("screen-list"),
        detail:  document.getElementById("screen-detail"),
      };
      function show(name) {
        Object.entries(screens).forEach(([key, el]) => {
          el.classList.toggle("active", key === name);
        });
        if (name === "list") screens.list.querySelector(".list-scroll").scrollTop = 0;
        if (name === "detail") document.getElementById("detail-scroll").scrollTop = 0;
      }
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.addEventListener("click", () => {
          vibrate(12);
          show(el.dataset.go);
        });
      });

      // ---------- intro fade-in ----------
      const introText = document.getElementById("intro-text");
      const introScreen = document.getElementById("screen-intro");
      requestAnimationFrame(() => {
        setTimeout(() => {
          introText.classList.add("in");
          runIntroHaptics();
        }, 250);
      });
      introScreen.addEventListener("click", () => {
        if (!introText.classList.contains("in")) return;
        vibrate(22);
        show("menu");
      });

      // ---------- burdens (church-funded projects) ----------
      const BURDENS = [
        {
          id: "schoolfees-grace",
          church: "Grace Chapel · Lagos",
          name: "School Fees · 12 Displaced Children",
          tag: "Education",
          featured: true,
          objective:
            "Cover one term of school fees, books, and uniforms for 12 children from displaced families in the Ajegunle community.",
          state: {
            raised: 620000,
            goal: 1500000,
            currency: "₦",
            note: "4 of 12 children fully covered. Term begins Sept 9.",
          },
          handlers: [
            { role: "Oversight", person: "Pastor Ada Okafor" },
            { role: "Treasury", person: "Sis. Funke Adeyemi" },
            { role: "School Liaison", person: "Bro. Tunde Bello" },
          ],
          workflow: [
            "Donors give in-app or to the church account (GTB 0123456789).",
            "Treasury reconciles weekly and posts ledger to the congregation.",
            "Funds released to the school bursar against an invoice per child.",
            "Bursar issues receipts; copies shared with donors who joined the burden.",
          ],
          delivery:
            "Sis. Funke delivers payment in person to Bright Future Academy each Friday. Photos of receipts are posted in the prayer group the same evening.",
          prayer: {
            members: 18,
            meets: "Wednesdays · 7:00pm WAT",
            focus:
              "That every child finishes the term, that their families find steady work, and that the school remains a place of peace.",
          },
        },
        {
          id: "borehole-rivers",
          church: "Living Stones · Port Harcourt",
          name: "Borehole for Eleme Village",
          tag: "Water",
          objective:
            "Drill and commission a community borehole serving roughly 400 households who currently walk 2.4 km for clean water.",
          state: {
            raised: 1850000,
            goal: 3200000,
            currency: "₦",
            note: "Site surveyed. Drilling contractor on standby pending balance.",
          },
          handlers: [
            { role: "Oversight", person: "Pastor Emeka Wodu" },
            { role: "Treasury", person: "Deacon Patience Igwe" },
            { role: "Contractor", person: "ClearFlow Drilling Ltd." },
            { role: "Community Lead", person: "Chief Nnamdi (village head)" },
          ],
          workflow: [
            "Donations pooled in a dedicated project account, separate from tithes.",
            "Milestone payments: 40% on drilling, 40% on casing, 20% on commissioning.",
            "Each milestone signed off by the community lead before release.",
            "Final audit posted publicly to donors and the village council.",
          ],
          delivery:
            "ClearFlow Drilling executes the work; Deacon Patience and Chief Nnamdi co-sign each milestone on site before treasury releases the next tranche.",
          prayer: {
            members: 31,
            meets: "Tuesdays · 6:30am WAT",
            focus:
              "That the water source is deep and clean, that the contractor delivers with integrity, and that the village is preserved through the dry season.",
          },
        },
        {
          id: "widows-food-mercy",
          church: "Mercy House · Nairobi",
          name: "Monthly Food Basket · 24 Widows",
          tag: "Provision",
          objective:
            "Provide a monthly food basket (maize, beans, oil, salt, sugar, soap) for 24 widows in the Kibera congregation for six months.",
          state: {
            raised: 184000,
            goal: 360000,
            currency: "KSh",
            note: "Month 3 of 6. Basket cost stable; supplier contract locked.",
          },
          handlers: [
            { role: "Oversight", person: "Pastor Grace Mwangi" },
            { role: "Treasury", person: "Bro. Samuel Otieno" },
            { role: "Supplier", person: "Tumaini Wholesalers" },
            { role: "Distribution", person: "Mama Wanjiku + 3 volunteers" },
          ],
          workflow: [
            "Donations collected through the in-app burden, ring-fenced from tithes.",
            "Treasury pays Tumaini Wholesalers on the 25th of each month.",
            "Baskets packed at the church hall on the 1st Saturday of each month.",
            "Distribution log signed by each widow; photos shared with donors.",
          ],
          delivery:
            "Mama Wanjiku and three volunteers deliver baskets door-to-door to widows who cannot collect from the church hall.",
          prayer: {
            members: 14,
            meets: "Saturdays · 9:00am EAT",
            focus:
              "Strength and dignity for each widow named in the list, and that no household goes hungry this month.",
          },
        },
        {
          id: "clinic-restock-hope",
          church: "Hope Assembly · Kumasi",
          name: "Restock Community Clinic",
          tag: "Health",
          objective:
            "Restock essential medicines (malaria, antibiotics, ORS, prenatal) at the church-run clinic serving the surrounding three neighbourhoods.",
          state: {
            raised: 9400,
            goal: 14000,
            currency: "₵",
            note: "Order placed with licensed wholesaler; awaiting balance to clear.",
          },
          handlers: [
            { role: "Oversight", person: "Pastor Kwabena Asare" },
            { role: "Treasury", person: "Sis. Akosua Mensah" },
            { role: "Clinic Lead", person: "Nurse Adwoa Boateng" },
            { role: "Supplier", person: "MediPlus Pharma Ghana" },
          ],
          workflow: [
            "Donations held in the clinic project account, audited monthly.",
            "Nurse Adwoa submits a restock list signed by the resident doctor.",
            "Treasury pays MediPlus directly; no cash handled by clinic staff.",
            "Stock log opened to donors who joined the burden.",
          ],
          delivery:
            "MediPlus delivers to the clinic; Nurse Adwoa receives, counts and signs in stock. Audit posted to the burden each month.",
          prayer: {
            members: 22,
            meets: "Thursdays · 8:00pm GMT",
            focus:
              "Healing for every patient who walks in this month, wisdom for the clinic staff, and that the supply chain holds steady.",
          },
        },
        {
          id: "roof-shelter-zion",
          church: "Zion Fellowship · Abuja",
          name: "Re-roof a Widow's Home",
          tag: "Shelter",
          objective:
            "Replace the leaking roof on Mama Ngozi's home in Karu before the rains return in earnest.",
          state: {
            raised: 410000,
            goal: 480000,
            currency: "₦",
            note: "Materials sourced. Carpenter booked for next weekend.",
          },
          handlers: [
            { role: "Oversight", person: "Pastor Ibrahim Yusuf" },
            { role: "Treasury", person: "Bro. Chinedu Okonkwo" },
            { role: "Carpenter", person: "Master Sule + 2 apprentices" },
            { role: "Site Lead", person: "Sis. Halima (deaconess)" },
          ],
          workflow: [
            "Donations held in the shelter project account.",
            "Materials paid for directly to the supplier (no cash to crew).",
            "Carpenter paid 50% on start, 50% on completion and sign-off.",
            "Final photos shared with donors when the roof is on.",
          ],
          delivery:
            "Master Sule and his apprentices install the roof; Sis. Halima oversees on site and signs off completion before final payment is released.",
          prayer: {
            members: 9,
            meets: "Sundays · 4:00pm WAT",
            focus:
              "Safety for the crew on the roof, dry days for the install, and lasting peace inside Mama Ngozi's home.",
          },
        },
      ];

      // ---------- joined prayer groups (persistent) ----------
      const STORAGE_KEY = "burden.prayer.joined";
      function loadJoined() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? new Set(JSON.parse(raw)) : new Set();
        } catch (_) { return new Set(); }
      }
      function saveJoined(set) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch (_) {}
      }
      const joined = loadJoined();

      function fmtMoney(amount, currency) { return currency + amount.toLocaleString("en-US"); }
      function pct(raised, goal) { return Math.max(0, Math.min(100, Math.round((raised / goal) * 100))); }

      // ---------- list configurations per menu item ----------
      const LIST_CONFIG = {
        weekly: {
          eyebrow: "This Week",
          title: "Burden of the Week",
          subtitle: "Pick the burden you want to carry before the Lord.",
          filter: (b) => b.featured === true,
        },
        burden: {
          eyebrow: "All Open",
          title: "Burden",
          subtitle: "Pick the burden you want to carry before the Lord.",
          filter: () => true,
        },
        spree: {
          eyebrow: "Carry More Than One",
          title: "Spree",
          subtitle: "Pick as many burdens as you can carry before the Lord today.",
          filter: () => true,
        },
      };

      // ---------- list screen ----------
      const burdenListEl = document.getElementById("burden-list");
      const listEyebrowEl = document.getElementById("list-eyebrow");
      const listTitleEl = document.getElementById("list-title");
      const listSubtitleEl = document.getElementById("list-subtitle");
      const listSubTitle = document.getElementById("list-sub-title");
      let currentListKey = "burden";

      function openList(key) {
        const cfg = LIST_CONFIG[key] || LIST_CONFIG.burden;
        currentListKey = key;
        listEyebrowEl.textContent = cfg.eyebrow;
        listTitleEl.textContent = cfg.title;
        listSubtitleEl.textContent = cfg.subtitle;
        listSubTitle.textContent = cfg.title;
        renderBurdenList(BURDENS.filter(cfg.filter));
        show("list");
      }

      function renderBurdenList(items) {
        burdenListEl.innerHTML = "";
        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "list-subtitle";
          empty.textContent = "No burdens here right now. Check back soon.";
          burdenListEl.appendChild(empty);
          return;
        }
        items.forEach((b) => {
          const p = pct(b.state.raised, b.state.goal);
          const card = document.createElement("button");
          card.className = "burden-card" + (b.featured && currentListKey === "weekly" ? " featured" : "");
          card.type = "button";
          card.innerHTML = `
            ${b.featured && currentListKey === "weekly" ? `<span class="featured-flag">This Week</span>` : ""}
            <div class="burden-card-row">
              <span class="burden-card-church">${b.church}</span>
              <span class="burden-card-tag">${b.tag}</span>
            </div>
            <h2 class="burden-card-name">${b.name}</h2>
            <p class="burden-card-objective">${b.objective}</p>
            <div class="burden-card-progress">
              <div class="progress-bar"><span style="width:${p}%"></span></div>
              <div class="burden-card-meta">
                <span>${fmtMoney(b.state.raised, b.state.currency)} of ${fmtMoney(b.state.goal, b.state.currency)}</span>
                <span>${b.prayer.members} praying</span>
              </div>
            </div>
          `;
          card.addEventListener("click", () => {
            vibrate(14);
            openBurden(b.id);
          });
          burdenListEl.appendChild(card);
        });
      }

      // Wire the 3 menu items to the list screen.
      document.querySelectorAll("[data-list]").forEach((el) => {
        el.addEventListener("click", () => {
          vibrate(14);
          openList(el.dataset.list);
        });
      });

      // ---------- burden detail ----------
      const detailScroll = document.getElementById("detail-scroll");
      function openBurden(id) {
        const b = BURDENS.find((x) => x.id === id);
        if (!b) return;
        const p = pct(b.state.raised, b.state.goal);
        const isJoined = joined.has(b.id);
        detailScroll.innerHTML = `
          <div class="detail-head">
            <span class="detail-church">${b.church} · ${b.tag}</span>
            <h2 class="detail-name">${b.name}</h2>
            <p class="detail-objective">${b.objective}</p>
            <div class="detail-progress">
              <div class="detail-progress-numbers">
                <span><strong>${fmtMoney(b.state.raised, b.state.currency)}</strong> of ${fmtMoney(b.state.goal, b.state.currency)}</span>
                <span>${p}%</span>
              </div>
              <div class="progress-bar"><span style="width:${p}%"></span></div>
            </div>
          </div>

          <div class="detail-section">
            <h3>Current State</h3>
            <p>${b.state.note}</p>
          </div>

          <div class="detail-section">
            <h3>Who Handles What</h3>
            <ul class="role-list">
              ${b.handlers.map(h => `
                <li><span class="role">${h.role}</span><span>${h.person}</span></li>
              `).join("")}
            </ul>
          </div>

          <div class="detail-section">
            <h3>Money Workflow</h3>
            <ol class="workflow-steps">
              ${b.workflow.map(step => `<li>${step}</li>`).join("")}
            </ol>
          </div>

          <div class="detail-section">
            <h3>On the Ground</h3>
            <p>${b.delivery}</p>
          </div>

          <div class="prayer-section">
            <h3>Prayer Group</h3>
            <div class="prayer-meta">${b.prayer.members + (isJoined ? 1 : 0)} praying · ${b.prayer.meets}</div>
            <p>Donors who carry this burden also pray for it. Prayer here is specific to this burden — nothing generic.</p>
            <p class="prayer-focus">“${b.prayer.focus}”</p>
          </div>

          <div class="detail-actions">
            <button class="btn ${isJoined ? "joined" : "btn-ghost"}" id="join-btn">
              ${isJoined ? "✓ In the prayer group" : "Join the prayer group"}
            </button>
            <button class="btn btn-primary" id="contribute-btn">Contribute</button>
          </div>
        `;

        document.getElementById("join-btn").addEventListener("click", () => {
          if (joined.has(b.id)) {
            joined.delete(b.id);
            vibrate(10);
          } else {
            joined.add(b.id);
            vibrate([18, 60, 24]);
          }
          saveJoined(joined);
          openBurden(b.id);
        });

        const contributeBtn = document.getElementById("contribute-btn");
        contributeBtn.addEventListener("click", () => {
          vibrate([14, 40, 14]);
          contributeBtn.textContent = "Thank you · receipt coming";
          contributeBtn.disabled = true;
          contributeBtn.style.opacity = "0.85";
        });

        show("detail");
      }
    </script>
  </body>
</html>
